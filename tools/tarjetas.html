<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Generador de tarjetas para compartir</title>
<!-- Herramienta interna: genera /img/compartir.jpg y /t/<plantilla>/compartir.jpg (1200 x 630).
     Uso: abrir con ?p=portada o ?p=pizzeria y capturar el elemento #tarjeta. No se publica. -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #555; }
#tarjeta { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; }
.izq { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 560px; display: flex; flex-direction: column; }
.marca { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; padding: 10px 18px 10px 12px; border-radius: 999px; font: 700 24px/1 "Inter", sans-serif; box-shadow: 0 0 0 1.5px rgba(25, 32, 43, .14); }
.marca img { width: 34px; height: 34px; }
h1 { font: 800 74px/1.02 "Inter Display", "Inter", sans-serif; letter-spacing: -0.02em; margin-top: 40px; text-wrap: balance; }
p { font: 400 29px/1.38 "Inter", sans-serif; margin-top: 22px; max-width: 30ch; }
.pie { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; padding: 16px 26px; border-radius: 999px; font: 700 26px/1 "Inter", sans-serif; }
.pie i { width: 14px; height: 14px; border-radius: 50%; background: #25D366; }
.tel { position: absolute; width: 330px; height: 640px; border-radius: 46px; border: 12px solid #141821; background: #141821; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.55); }
.tel img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 34px; display: block; }
</style>
</head>
<body>
<div id="tarjeta"></div>
<script src="/core/config.js"></script>
<script src="/core/catalogos.js"></script>
<script src="/t/sushi/datos.js"></script>
<script src="/t/arepera/datos.js"></script>
<script src="/t/pizzeria/datos.js"></script>
<script src="/t/burgers/datos.js"></script>
<script src="/t/boutique/datos.js"></script>
<script>
(function () {
  const P = window.EU_PLANTILLAS, C = window.EU_CONFIG, K = window.EU_CATALOGOS;
  const cual = new URLSearchParams(location.search).get("p") || "portada";
  const t = document.getElementById("tarjeta");
  const TEXTOS = {
    pizzeria: ["Plantilla Pizzería", "El cliente arma su pizza, mitad y mitad incluida, y el pedido te llega por WhatsApp."],
    arepera: ["Plantilla Arepera", "El cliente arma su arepa con lo que tengas hoy y te llega el pedido por WhatsApp."],
    burgers: ["Plantilla Burgers y perros", "Tu menú con fotos, combos y delivery, con pedidos directo a tu WhatsApp."],
    sushi: ["Plantilla Sushi", "Tu carta de rolls con carrito y pedidos directo a tu WhatsApp."],
    boutique: ["Plantilla Boutique", "Tu catálogo con tallas y colores, y los pedidos directo a tu WhatsApp."],
  };
  if (cual === "portada") {
    t.style.background = "#E9EDF3"; t.style.color = "#19202B";
    t.innerHTML = `<div class="izq">
        <span class="marca" style="background:#fff;color:#19202B"><img src="/img/favicon.svg" alt="">${C.marca}</span>
        <h1 style="font-size:66px">Tu página de pedidos por WhatsApp</h1>
        <p style="color:#4A5466;font-size:27px">Tu menú o catálogo en línea. Cambias precios, fotos y la tasa del día desde tu teléfono.</p>
        <span class="pie" style="background:#2A44C8;color:#fff"><i></i>5 plantillas listas para tu negocio</span>
      </div>
      <div class="tel" style="left:648px;top:96px;transform:rotate(-7deg)"><img src="${P.pizzeria.vistaPrevia}" alt=""></div>
      <div class="tel" style="left:930px;top:120px;transform:rotate(6deg)"><img src="${P.boutique.vistaPrevia}" alt=""></div>
      <div class="tel" style="left:780px;top:60px;z-index:2"><img src="${P.burgers.vistaPrevia}" alt=""></div>`;
    return;
  }
  const pl = P[cual];
  const m = (pl.temas && pl.temas[0] && pl.temas[0].muestra) || ["#19202B", "#F5C451"];
  const fondo = m[0], tinta = K.color.sobre(fondo);
  t.style.background = fondo; t.style.color = tinta;
  const [titulo, texto] = TEXTOS[cual];
  t.innerHTML = `<div class="izq">
      <span class="marca" style="background:#fff;color:#19202B"><img src="/img/favicon.svg" alt="">${C.marca}</span>
      <h1>${titulo}</h1>
      <p style="opacity:.92">${texto}</p>
      <span class="pie" style="background:${tinta};color:${fondo}"><i></i>Mírala funcionando</span>
    </div>
    <div class="tel" style="left:770px;top:62px;transform:rotate(5deg)"><img src="${pl.vistaPrevia}" alt=""></div>`;
})();
</script>
</body>
</html>
